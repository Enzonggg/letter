<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A Letter for You</title>
    <style>
      /* Reset & Body */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Georgia", serif;
        background: #1e1e2f;
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-direction: column;
        overflow: hidden;
      }

      /* Hearts background */
      .hearts {
        position: fixed;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        overflow: hidden;
        z-index: -1;
      }

      .heart {
        position: absolute;
        bottom: -20px;
        width: 20px;
        height: 20px;
        background: red; /* red hearts */
        transform: rotate(45deg);
        animation: floatUp 6s linear infinite;
        opacity: 0.7;
      }

      .heart::before,
      .heart::after {
        content: "";
        position: absolute;
        width: 20px;
        height: 20px;
        background: red; /* red hearts */
        border-radius: 50%;
      }

      .heart::before {
        top: -10px;
        left: 0;
      }

      .heart::after {
        left: -10px;
        top: 0;
      }

      @keyframes floatUp {
        0% {
          transform: translateY(0) rotate(45deg);
          opacity: 0.7;
        }
        100% {
          transform: translateY(-100vh) rotate(45deg);
          opacity: 0;
        }
      }

      /* Intro text */
      .intro {
        text-align: center;
        font-size: 1.4rem;
        margin-bottom: 30px;
        opacity: 1;
        transition: opacity 1s ease;
      }

      /* Button */
      .btn {
        padding: 10px 20px;
        font-size: 1rem;
        background: #f5eeef;
        border: none;
        border-radius: 20px;
        cursor: pointer;
        color: rgb(5, 2, 2);
        transition: 0.3s;
      }
      .btn:hover {
        background: #b1acad;
      }

      /* Letter box */
      .letter {
        display: none;
        background: repeating-linear-gradient(
          to bottom,
          #fdf6e3 0px,
          #fdf6e3 27px,
          #d2d2d2 28px
        );
        color: #333;
        padding: 30px 30px 30px 70px;
        border-radius: 10px;
        width: 80%;
        max-width: 500px;
        height: 600px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
        font-size: 1.1rem;
        line-height: 1.6;
        text-align: left;
        position: relative;
        white-space: pre-wrap;
        overflow-wrap: break-word;
        font-family: "Courier New", monospace;
        overflow: visible;
      }

      .letter p {
        margin-top: -55px;
        overflow: hidden;
      }

      .letter::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 25px;
        height: 100%;
        background-image: radial-gradient(circle, #1e1e2f 6px, transparent 7px);
        background-size: 25px 40px;
        background-repeat: repeat-y;
        background-position: center;
        pointer-events: none;
      }

      .signature {
        position: absolute;
        bottom: -20px;
        right: 6px;
        width: 180px;
        opacity: 0.9;
        pointer-events: none;
        transform: rotate(-2deg);
      }
    </style>
  </head>
  <body>
    <!-- Floating hearts -->
    <div class="hearts"></div>

    <!-- Intro -->
    <div class="intro" id="introText">
      I hope you read this, even if it's a little late.
    </div>
    <button class="btn" onclick="showLetter()">Read it</button>

    <!-- Letter -->
    <div class="letter" id="letterBox">
      <p id="typedText"></p>
      <img src="ttd.png" alt="Signature" class="signature" />
    </div>

    <script>
      // Letter message (friendly Valentine's greeting)
      const message = `Happy Valentine’s Day!

Just wanted to send you a simple greeting.
No expectations, no pressure 
just wishing you happiness today.

I hope you’re happy.
I hope you're doing well and smiling a little extra today.`;

      // Typewriter function
      function showLetter() {
        document.getElementById("introText").style.opacity = 0;
        document.querySelector(".btn").style.display = "none";

        setTimeout(() => {
          const letterBox = document.getElementById("letterBox");
          const typedText = document.getElementById("typedText");

          letterBox.style.display = "block";
          typedText.innerHTML = "";

          let i = 0;

          function typeWriter() {
            if (i < message.length) {
              const char = message.charAt(i);

              if (char === "\n") {
                typedText.innerHTML += "<br><br>";
              } else {
                typedText.innerHTML += char;
              }

              i++;

              // Balanced typing speed
              let delay = 40 + Math.random() * 30;

              // Slight pause on punctuation
              if (char === "." || char === "!" || char === "?") delay += 300;
              else if (char === ",") delay += 150;

              setTimeout(typeWriter, delay);
            }
          }

          typeWriter();
        }, 400);
      }

      // Floating hearts generator
      const heartsContainer = document.querySelector(".hearts");

      function createHeart() {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = 4 + Math.random() * 3 + "s";
        heart.style.opacity = Math.random();
        heartsContainer.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 7000);
      }

      setInterval(createHeart, 500);
    </script>
  </body>
</html>
